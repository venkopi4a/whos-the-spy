<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who's the Spy</title>
<meta name="theme-color" content="#0f1a2a">
<meta name="description" content="Who's the Spy / Кой е шпионинът? A pass-and-play party game for 4–8 friends on one phone. One secret place. Someone's lying.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0f1a2a;--panel:#18273d;--deep:#0c1524;--line:#2c4261;--text:#eaf0f7;--mute:#8fa3bd;--accent:#f0b73e;--spy:#ff5a5f;--ok:#4fd1a5;
box-sizing:border-box;--safe-b:env(safe-area-inset-bottom,0px);--bottom-gap:calc(26px + var(--safe-b))}
*,*:before,*:after{box-sizing:inherit}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#1f3558 0,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px var(--bottom-gap);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.3rem;line-height:1;margin:4px 0 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;line-height:1.12;margin:0;font-weight:800}
p{margin:0;color:var(--mute);line-height:1.45}
.small{font-size:.88rem}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:16px;padding:15px 18px;min-height:56px;background:var(--accent);color:#1a1405;cursor:pointer;width:100%;box-shadow:0 6px 0 #b98a20;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98a20}
.btn.big{font-size:1.25rem;min-height:64px}
.btn.alt{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 5px 0 #0a1320}
.btn.alt:active{box-shadow:0 1px 0 #0a1320}
.btn.red{background:var(--spy);color:#fff;box-shadow:0 6px 0 #b8383c}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:8px}
.chip{flex:1;font:inherit;font-weight:600;padding:12px 0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--deep);color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.chip[disabled]{opacity:.3;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.top .rnd{color:var(--mute);font-weight:600;font-size:.9rem}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:1.15rem;cursor:pointer;flex:none}
.applogo{width:112px;height:112px;border-radius:26px;box-shadow:0 10px 30px rgba(0,60,200,.45),0 0 0 2px rgba(240,183,62,.5);animation:wob 2.6s ease-in-out infinite}
.hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.logo{font-size:4rem;line-height:1;display:inline-block;animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-5px)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-weight:800}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--deep);color:var(--text);font:inherit;font-size:1.7rem;font-weight:800;cursor:pointer}
.stepper b{font-size:2.2rem;flex:1;text-align:center}
.avs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:none;border:0;padding:0;color:var(--mute);font:inherit;cursor:pointer;text-align:left}
.avs span{font-size:1.35rem;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--deep);border-radius:50%;border:1px solid var(--line)}
.avs em{font-style:normal;margin-left:auto;font-size:.9rem;color:var(--accent);font-weight:700}
.packs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.pack{flex:0 0 auto;min-width:104px;scroll-snap-align:start;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--deep);color:var(--text);font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.pack.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pack .pi{font-size:1.6rem}.pack small{color:var(--mute)}
.sticky{position:sticky;bottom:0;padding:16px 0 var(--bottom-gap);margin-top:auto;margin-bottom:calc(-1 * var(--bottom-gap));background:linear-gradient(rgba(15,26,42,0),var(--bg) 40%);display:flex;flex-direction:column;gap:10px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-weight:600;text-decoration:underline;padding:10px;cursor:pointer}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}
.center .em{font-size:4.6rem;line-height:1;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) scale(1.05)}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{flex:1;max-width:32px;height:7px;border-radius:4px;background:var(--line)}
.dots i.d{background:var(--ok)}.dots i.c{background:var(--accent)}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;margin:4px 0}
.card{width:100%;aspect-ratio:3/4.2;border-radius:16px;border:2px solid #3d5a85;cursor:pointer;font:inherit;color:var(--text);position:relative;overflow:hidden;
background:radial-gradient(circle at 50% 45%,#2a4777 0,#16263f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.card:before{content:"";position:absolute;inset:7px;border:1px solid rgba(240,183,62,.45);border-radius:11px}
.card .eye{font-size:1.9rem}.card .num{font-weight:800;font-size:1.2rem;color:var(--accent)}
.card:active{filter:brightness(1.35)}
.cards.shuffling{pointer-events:none}
.cards.shuffling .cw{animation:none!important}
.btn[disabled]{opacity:.5}
.slot{width:100%;aspect-ratio:3/4.2;border-radius:16px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;gap:4px;text-align:center;padding:4px}
.slot small{font-size:.66rem;color:var(--mute);line-height:1.2}
.cards.deal .cw{animation:deal .45s ease both}
@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(-10deg)}to{opacity:1;transform:none}}
.cards:not(.deal) .cw{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.cards.shuf .cw{animation:jig .5s ease both}
.cards.shuf .cw:nth-child(odd){animation-name:jig2}
@keyframes jig{25%{transform:translate(-18px,-6px) rotate(-12deg)}60%{transform:translate(14px,4px) rotate(8deg)}}
@keyframes jig2{25%{transform:translate(18px,-6px) rotate(12deg)}60%{transform:translate(-14px,4px) rotate(-8deg)}}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;perspective:1000px;min-height:360px}
#fly{will-change:transform}
.fi{position:relative;width:100%;height:min(58vh,430px);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.fi.up{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:22px}
.face.back{background:radial-gradient(circle at 50% 45%,#2a4777 0,#16263f 70%);border:3px solid #3d5a85}
.face.back .eye{font-size:5rem}
.face.front{transform:rotateY(180deg)}
.face.place{background:linear-gradient(160deg,#1c3b4a,#18273d);border:3px solid var(--ok)}
.face.spy{background:linear-gradient(160deg,#4a1a20,#25090d);border:3px solid var(--spy)}
.face .em{font-size:4.6rem;line-height:1}
.face .big{font-size:2.2rem;font-weight:800;line-height:1.05}
.hint{text-align:center}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:12}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:565.5;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring.low .pr{stroke:var(--spy)}.ring.low .tm{animation:pulse 1s infinite}
.ring.paused .tm{opacity:.45}
.tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{transform:scale(1.08)}}
.qcard{background:linear-gradient(160deg,#233a5e,#18273d);border:1px solid #3d5a85;border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;animation:pop .35s ease}
.qcard .who{font-weight:800;font-size:1rem;color:var(--accent)}
.qcard .q{font-size:1.2rem;font-weight:600;color:var(--text);line-height:1.3}
.qcard .btn{min-height:46px;padding:10px;font-size:.95rem}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.tbar{display:flex;gap:8px}
.tbar .btn{flex:1;font-size:.9rem;padding:10px 4px;min-height:48px}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.votes .btn.alt{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.95rem;padding:12px 6px}
.votes .a{font-size:1.9rem}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list .chip{font-size:.9rem;padding:10px 6px;text-align:left;display:flex;gap:8px;align-items:center}
.drum{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.drum .bav{font-size:6rem;line-height:1;animation:shake .15s infinite}
.drum.done .bav{animation:pop .4s}
@keyframes shake{25%{transform:translate(-3px,2px) rotate(-3deg)}75%{transform:translate(3px,-2px) rotate(3deg)}}
.verdict{font-size:2rem;font-weight:800;padding:14px 22px;border-radius:16px;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
.verdict.spy{background:var(--spy);color:#fff}.verdict.inn{background:var(--ok);color:#06251b}
@keyframes stamp{from{transform:scale(2.4) rotate(-12deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.drumdots{font-size:2.4rem;animation:pulse .3s infinite}
#app.shake{animation:shake .12s 5}
.res{border-radius:20px;padding:18px;text-align:center;background:var(--panel);border:2px solid var(--ok);display:flex;flex-direction:column;gap:4px;align-items:center}
.res .em{font-size:3rem;line-height:1}.res .big{font-size:1.8rem;font-weight:800}
.wl{display:grid;gap:6px}
.wr{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.wr.spyr{background:#3a1519;border-color:var(--spy)}
.wr .a{font-size:1.4rem}.wr span{flex:1;font-weight:600}.wr small{color:var(--mute);text-align:right}
.sb{display:grid;gap:6px}
.sc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:9px 14px;background:var(--deep)}
.sc.lead{border-color:var(--accent)}
.sc .a{font-size:1.4rem}.sc span{flex:1;font-weight:600}.sc b{font-size:1.25rem}
.wr .a,.sc .a,.sc .delta,.wr small{flex:none}
.delta{font-size:.8rem;font-weight:800;color:var(--ok);margin-right:4px;animation:pop .5s .4s both}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0}
.pod{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
.pod.p1{animation-delay:.5s}.pod.p2{animation-delay:.25s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.pod .bar{width:100%;border-radius:12px 12px 0 0;background:var(--panel);border:1px solid var(--line);display:flex;justify-content:center;padding-top:8px;font-weight:800;font-size:1.3rem}
.pod .a{font-size:2.6rem;line-height:1}.pod .n{font-weight:700;font-size:.85rem}
.pod.p1 .bar{height:140px;background:linear-gradient(#f0b73e,#b98a20);color:#1a1405}
.pod.p2 .bar{height:100px}.pod.p3 .bar{height:72px}
.nrow{display:flex;gap:8px;align-items:center}
.nrow .av{width:52px;height:52px;font-size:1.7rem;border-radius:14px;border:1px solid var(--line);background:var(--deep);cursor:pointer;flex:none}
.nrow input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--deep);color:var(--text);-webkit-user-select:text;user-select:text}
.nrow .icon-btn{height:52px}
.tut .em{font-size:5.4rem}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx span{position:absolute;top:-50px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:#fff;color:#0f1a2a;padding:12px 18px;border-radius:999px;font-weight:700;transition:transform .3s;z-index:60;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0)}
.good{color:var(--ok)}.bad{color:var(--spy)}
@media (prefers-reduced-motion:reduce){.fi{transition:none}.applogo,.logo,.center .em,.cards .cw,.ring .tm,.drum .bav,#app.shake,.pod,.qcard{animation:none!important}#fx{display:none}}

/* v5 additions */

.tbar .btn .i{font-size:1.25rem;line-height:1}
.tin{width:100%;font:inherit;font-size:1rem;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--deep);color:var(--text);-webkit-user-select:text;user-select:text}
.prow .pnum{width:22px;text-align:center;color:var(--mute);font-weight:700;flex:none}
.pack.new{border-style:dashed;color:var(--mute);align-items:center;justify-content:center;text-align:center}
.pack.new .pi{color:var(--accent)}
.list.ro .chip{cursor:default}
.steps b{color:var(--text)}
.spyhad{margin-top:6px}.spyhad b{color:var(--text)}
.aw{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(240,183,62,.08);border:1px solid rgba(240,183,62,.35);animation:pop .4s ease both}
.aw .ai{font-size:1.9rem;flex:none}.aw b{display:block;color:var(--accent)}.aw small{color:var(--mute)}
input::placeholder{color:#5d7090}

<div id="app"></div>

// ---------- HELPERS ----------
const $=id=>document.getElementById(id);
const R=n=>Math.floor(Math.random()*n);
const rng=n=>[...Array(n).keys()];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const ALL=Object.values(PACKS).flatMap(P=>P.p);
const byEn=Object.fromEntries(ALL.map(p=>[p.en,p]));
const TWIN={};TW.forEach(([a,b])=>{TWIN[a]=b;TWIN[b]=a});

// ---------- STATE ----------
const DEF_LANG=String(navigator.language||"").toLowerCase().startsWith("bg")?"bg":"en";
const DEF={n:6,spyMode:1,mode:"classic",diff:"short",mins:5,pack:"classic",target:7,sound:true,seen:false,lang:DEF_LANG,custom:[],
  players:POOL.slice(0,8).map(p=>({e:p[0],name:p[DEF_LANG==="bg"?2:1]}))};
let C=Object.assign({},DEF,ld("spy_cfg",{})||{});
if(!Array.isArray(C.players)||C.players.length<8)C.players=DEF.players;
if(!Array.isArray(C.custom))C.custom=[];
if(!L[C.lang])C.lang="en";
const customOf=k=>C.custom.find(c=>c.id===k);
const packOk=k=>!!PACKS[k]||k==="mix"||!!customOf(k);
if(!packOk(C.pack))C.pack="classic";
const save=()=>sv("spy_cfg",C);
const blankSt=()=>rng(8).map(()=>({liar:0,mind:0,sus:0,loyal:0}));
let S={screen:C.seen?"home":"tut",tut:0,scores:ld("spy_scores",null)||[0,0,0,0,0,0,0,0],st:ld("spy_stats",null),round:ld("spy_round",0)};
if(!Array.isArray(S.st)||S.st.length<8)S.st=blankSt();
const saveM=()=>{sv("spy_scores",S.scores);sv("spy_stats",S.st);sv("spy_round",S.round)};
let tmr=null,AC=null,WL=null;

const t=(k,...a)=>{let v=(L[C.lang]||L.en)[k];if(v===undefined)v=L.en[k];return typeof v==="function"?v(...a):v};
const pn=p=>p[C.lang]||p.en;
const rawName=i=>(C.players[i].name||"").trim()||(C.lang==="bg"?"Играч ":"Player ")+(i+1);
const nm=i=>esc(rawName(i));
const av=i=>C.players[i].e;
const packInfo=k=>k==="mix"?{name:t("mix"),icon:"🎲"}:PACKS[k]?{name:PACKS[k].name[C.lang]||PACKS[k].name.en,icon:PACKS[k].icon}:{name:(customOf(k)||{}).name||t("myPack"),icon:"⭐"};
const placesFor=k=>k==="mix"?ALL:PACKS[k]?PACKS[k].p:((customOf(k)||{places:[]}).places.map(s=>({e:"📍",en:s,bg:s})));
function buzz(p){if(!C.sound)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function beep(f,d,ty){if(!C.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.2,"triangle"),i*130))}
function toast(x){const el=$("toast");el.textContent=x;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200)}
function confetti(set){const fx=$("fx");for(let i=0;i<46;i++){const d=document.createElement("span");d.textContent=set[R(set.length)];d.style.left=Math.random()*100+"%";d.style.fontSize=(16+Math.random()*22)+"px";d.style.animationDuration=(1.8+Math.random()*1.8)+"s";d.style.animationDelay=Math.random()*.5+"s";fx.appendChild(d)}setTimeout(()=>{fx.innerHTML=""},4500)}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>WL=w).catch(()=>{})}catch(e){}}
function sleep(){try{WL&&WL.release();WL=null}catch(e){}}
function go(s){if(s!=="result"&&s!=="champ"){const fx=$("fx");if(fx)fx.innerHTML=""}S.screen=s;render()}
const cardOf=p=>S.cards.find(c=>c.takenBy===p);
const isSpy=p=>{const c=cardOf(p);return !!(c&&c.spy)};
const spyList=()=>rng(C.n).filter(isSpy);
const fmt=s=>{const m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x};
function applyLang(){document.documentElement.lang=C.lang;document.title=t("title")}

// ---------- SETUP ----------
function setN(d){C.n=Math.max(4,Math.min(8,C.n+d));save();buzz(10);beep(400+C.n*30,.06);render()}
function setMode(m){if(m===2&&C.n<5){toast(t("needs5"));return}C.spyMode=m;save();buzz(10);render()}
function setGM(m){C.mode=m;save();buzz(10);beep(520,.05);render()}
function setDiff(d){C.diff=d;save();buzz(10);render()}
function setPack(k){C.pack=k;save();buzz(10);beep(520,.05);render()}
function setMins(m){C.mins=m;save();render()}
function setTarget(m){C.target=m;save();render()}
function toggleSound(){C.sound=!C.sound;save();render();if(C.sound)beep(660,.1)}
function toggleLang(){
  const nl=C.lang==="en"?"bg":"en",oi=C.lang==="en"?1:2,ni=nl==="en"?1:2;
  C.players.forEach(p=>{const m=POOL.find(q=>q[oi]===p.name);if(m)p.name=m[ni]});
  C.lang=nl;save();applyLang();buzz(10);beep(600,.06);render();
}
function resetMatch(){S.scores=[0,0,0,0,0,0,0,0];S.st=blankSt();S.round=0;saveM();render()}
const li=()=>C.lang==="bg"?2:1;
function rndName(i){const used=C.players.map(p=>p.name);const free=POOL.filter(p=>used.indexOf(p[li()])<0);const p=free[R(free.length)]||POOL[R(POOL.length)];C.players[i]={e:p[0],name:p[li()]};save();buzz(15);beep(700,.06);render()}
function rndAll(){C.players=shuffle(POOL).slice(0,8).map(p=>({e:p[0],name:p[li()]}));save();buzz([10,30,10]);jingle([523,659]);render()}
function setName(i,v){C.players[i].name=v.slice(0,18);save()}
function tutNext(){if(S.tut<TUT.en.length-1){S.tut++;beep(500+S.tut*80,.07);render()}else tutDone()}
function tutDone(){C.seen=true;save();go("home")}

// ---------- CUSTOM PACKS ----------
function newPack(){S.edit={id:null,name:"",places:["","","",""]};go("pack")}
function editPack(){const c=customOf(C.pack);if(!c)return;S.edit={id:c.id,name:c.name,places:c.places.slice()};go("pack")}
function addPlace(){S.edit.places.push("");S.keep=true;render();const ins=document.querySelectorAll(".prow input");const l=ins[ins.length-1];if(l){l.focus();l.scrollIntoView({block:"center"})}}
function delPlace(i){S.edit.places.splice(i,1);S.keep=true;render()}
function savePack(){
  const seen=new Set(),pl=[];
  S.edit.places.forEach(v=>{v=String(v||"").trim().slice(0,32);const k=v.toLowerCase();if(v&&!seen.has(k)){seen.add(k);pl.push(v)}});
  if(pl.length<4){toast(t("need4"));buzz([60,40,60]);return}
  const name=String(S.edit.name||"").trim().slice(0,24)||t("myPack");
  if(S.edit.id){const c=customOf(S.edit.id);if(c){c.name=name;c.places=pl}}
  else{const id="c"+Date.now().toString(36);C.custom.push({id,name,places:pl});C.pack=id}
  save();toast(t("saved"));buzz(20);jingle([523,659]);go("home");
}
function delPack(){
  if(!S.delArm){S.delArm=true;toast(t("delArm"));setTimeout(()=>S.delArm=false,2200);return}
  S.delArm=false;C.custom=C.custom.filter(c=>c.id!==S.edit.id);if(!packOk(C.pack))C.pack="classic";save();go("home");
}

// ---------- ROUND ----------
function newRound(){
  clearInterval(tmr);
  const list=placesFor(C.pack);
  if(list.length<4){toast(t("need4"));return}
  let p;do{p=list[R(list.length)]}while(S.lastPlace===p.en);
  S.place=p;S.lastPlace=p.en;
  S.under=C.mode==="under";
  if(S.under){const tw=TWIN[p.en]&&byEn[TWIN[p.en]];S.spyPlace=tw||shuffle(list.filter(x=>x.en!==p.en))[0]}
  S.pool=(!S.under&&C.diff==="short"&&list.length>15)?shuffle([p,...shuffle(list.filter(x=>x.en!==p.en)).slice(0,14)]):list.slice();
  S.ns=(C.spyMode===2&&C.n>=5&&Math.random()<.5)?2:1;
  const deck=[];for(let i=0;i<C.n;i++)deck.push(i<S.ns);
  S.cards=shuffle(deck).map(spy=>({spy,takenBy:null}));
  S.turn=0;S.round++;saveM();S.out=[];S.caught=0;S.voted=null;S.early=false;S.flipped=false;S.paused=false;S.quitArm=false;
  wake();buzz(30);jingle([392,523]);go("pass");
}
function quit(){
  if(S.quitArm){clearInterval(tmr);S.quitArm=false;S.round=Math.max(0,S.round-1);saveM();sleep();go("home")}
  else{S.quitArm=true;toast(t("quitArm"));setTimeout(()=>S.quitArm=false,2200)}
}
function pick(i,el){
  if(S.cards[i].takenBy!==null||shuffling)return;
  buzz(20);beep(420,.08);S.from=el.getBoundingClientRect();
  S.cards[i].takenBy=S.turn;S.sel=i;S.flipped=false;go("reveal");
}
let shuffling=false;
function shuf(){
  if(shuffling)return;
  const idx=rng(C.n).filter(i=>S.cards[i].takenBy===null);
  const deck=shuffle(idx.map(k=>S.cards[k].spy));
  idx.forEach((k,j)=>{S.cards[k].spy=deck[j]});
  const box=document.querySelector(".cards"),btn=$("shufBtn");
  const wraps=[...box.querySelectorAll(".cw")].filter(w=>w.querySelector(".card"));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce||!wraps.length||!wraps[0].animate){buzz(30);beep(400,.08);toast(t("shuffled"));return}
  shuffling=true;box.classList.remove("deal");box.classList.add("shuffling");if(btn)btn.disabled=true;
  const br=box.getBoundingClientRect(),cx=br.left+br.width/2,cy=br.top+br.height/2;
  const done=wraps.map((w,k)=>{
    const r=w.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2)-k*3;
    const side=k%2?1:-1,j=()=>(Math.random()*10-5).toFixed(1);
    w.style.zIndex=10+k;
    return w.animate([
      {transform:"translate(0,0) rotate(0deg) scale(1)"},
      {transform:`translate(${dx}px,${dy}px) rotate(${j()}deg) scale(.92)`,offset:.22},
      {transform:`translate(${dx+side*46}px,${dy-10}px) rotate(${side*15}deg) scale(.92)`,offset:.34},
      {transform:`translate(${dx}px,${dy}px) rotate(${j()}deg) scale(.92)`,offset:.44},
      {transform:`translate(${dx-side*46}px,${dy-10}px) rotate(${-side*15}deg) scale(.92)`,offset:.54},
      {transform:`translate(${dx}px,${dy}px) rotate(${j()}deg) scale(.92)`,offset:.64},
      {transform:`translate(${dx}px,${dy-24}px) rotate(0deg) scale(1.02)`,offset:.72},
      {transform:"translate(0,0) rotate(0deg) scale(1)"}
    ],{duration:1400,delay:k*40,easing:"cubic-bezier(.45,.05,.3,1)",fill:"none"}).finished;
  });
  beep(220,.25,"sawtooth");buzz(20);
  for(let q=0;q<18;q++)setTimeout(()=>{beep(300+Math.random()*250,.03,"square");if(q%3===0)buzz(6)},420+q*28);
  setTimeout(()=>{beep(140,.12);buzz(25)},1150);
  Promise.all(done).catch(()=>{}).then(()=>{
    wraps.forEach(w=>w.style.zIndex="");box.classList.remove("shuffling");
    if(btn)btn.disabled=false;shuffling=false;beep(520,.08);buzz(15);
  });
}
function flip(){
  const f=$("fi");S.flipped=!S.flipped;f.classList.toggle("up",S.flipped);
  buzz(40);beep(S.flipped?660:330,.12);
  $("hp").style.visibility=S.flipped?"visible":"hidden";
  $("tip").textContent=S.flipped?t("tip2"):t("tip1");
}
function hide(){S.turn++;S.flipped=false;beep(300,.08);go(S.turn>=C.n?"ready":"pass")}
function startTimer(){
  S.total=C.mins*60;S.left=S.total;S.paused=false;
  S.asker=R(C.n);S.target=other(S.asker);S.q=R(QS.en.length);
  jingle([523,659,784]);buzz(60);go("timer");
  clearInterval(tmr);tmr=setInterval(tick,1000);
}
function tick(){
  if(S.paused)return;
  S.left--;
  if(S.left===60){toast(t("oneMin"));buzz([60,60,60])}
  if(S.left<=10&&S.left>0)beep(880,.06);
  paint();
  if(S.left<=0){clearInterval(tmr);buzz([200,100,200]);jingle([523,392,262]);toast(t("timeUp"));go("vote")}
}
function paint(){
  const tm=$("t"),p=$("pr"),r=$("ring");if(!tm)return;
  tm.textContent=fmt(S.left);p.style.strokeDashoffset=565.5*(1-S.left/S.total);
  r.classList.toggle("low",S.left<=30);r.classList.toggle("paused",S.paused);
}
function pause(){S.paused=!S.paused;$("pz").innerHTML=pzInner();paint();buzz(15)}
const pzInner=()=>`<span class="i">${S.paused?"▶️":"⏸️"}</span>${S.paused?t("bResume"):t("bPause")}`;
function addMin(){S.total+=60;S.left+=60;paint();buzz(15);beep(600,.06)}
function other(a){let x;do{x=R(C.n)}while(x===a&&C.n>1);return x}
function nextQ(){S.asker=S.target;S.target=other(S.asker);let q;do{q=R(QS.en.length)}while(q===S.q);S.q=q;buzz(15);beep(560,.06);render()}
function peekSel(i){S.peek=i;S.flipped=false;S.from=null;go("peek")}
function peekHide(){S.flipped=false;go("timer")}
function spyPick(i){
  if(!isSpy(i)){S.scores[i]=Math.max(0,S.scores[i]-1);saveM();buzz([100,50,100]);beep(150,.3,"sawtooth");toast(t("notSpy",rawName(i)));go("timer");return}
  clearInterval(tmr);S.voted=i;S.early=true;buzz(80);go("guess");
}
function startVote(){clearInterval(tmr);go("vote")}
function vote(p){
  S.out.push(p);S.accused=p;
  if(!isSpy(p)){S.st[p].sus++;saveM()}
  go("drum");

function finish(w,why,pts){

function awards(){

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function buildImage(){
  const W=1080,H=1920,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1f3a66");g.addColorStop(1,"#0a1322");x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W/2,560,40,W/2,560,620);rg.addColorStop(0,"rgba(240,183,62,.28)");rg.addColorStop(1,"rgba(240,183,62,0)");x.fillStyle=rg;x.fillRect(0,0,W,H);
  try{await document.fonts.ready}catch(e){}
  const F=(w,s)=>`${w} ${s}px Archivo, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  const fit=(txt,w,s,max)=>{x.font=F(w,s);while(x.measureText(txt).width>max&&s>20){s-=2;x.font=F(w,s)}};
  x.textAlign="center";x.textBaseline="middle";
  try{const im=await loadImg("icon-512.png");x.save();rr(x,W/2-120,80,240,240,56);x.clip();x.drawImage(im,W/2-120,80,240,240);x.restore()}catch(e){}
  x.fillStyle="#eaf0f7";fit(t("title"),800,84,W-120);x.fillText(t("title"),W/2,400);
  const idx=ranking(),c=idx[0];
  x.fillStyle="#f0b73e";x.font=F(800,40);x.fillText("🏆 "+t("imgChamp").toUpperCase(),W/2,500);
  x.font=F(400,130);x.fillText(av(c),W/2,620);
  x.fillStyle="#eaf0f7";fit(rawName(c),800,78,W-140);x.fillText(rawName(c),W/2,740);
  x.fillStyle="#8fa3bd";x.font=F(600,44);x.fillText(S.scores[c]+" "+t("ptsWord",S.scores[c]),W/2,805);
  let y=890;
  idx.slice(1).forEach((p,k)=>{
    x.fillStyle="rgba(255,255,255,.07)";rr(x,120,y-27,W-240,54,18);x.fill();
    x.textAlign="left";x.fillStyle="#8fa3bd";x.font=F(700,30);x.fillText((k+2)+".",150,y);
    x.font=F(400,34);x.fillText(av(p),205,y);
    x.fillStyle="#eaf0f7";x.font=F(600,32);x.fillText(rawName(p).slice(0,24),262,y);
    x.textAlign="right";x.fillText(String(S.scores[p]),W-150,y);x.textAlign="center";y+=62;
  });
  const aw=awards();
  if(aw.length){
    y+=40;x.fillStyle="#f0b73e";x.font=F(800,36);x.fillText(t("awardsT").toUpperCase(),W/2,y);y+=66;
    aw.forEach(a=>{
      x.fillStyle="rgba(240,183,62,.10)";rr(x,120,y-34,W-240,68,20);x.fill();
      x.textAlign="left";x.fillStyle="#f0b73e";x.font=F(700,32);x.fillText(a.title,150,y);
      x.textAlign="right";x.fillStyle="#eaf0f7";x.font=F(600,32);x.fillText(av(a.p)+" "+rawName(a.p).slice(0,18),W-150,y);x.textAlign="center";y+=82;
    });
  }
  const host=location.protocol.startsWith("http")?(location.host+location.pathname).replace(/\/(index\.html)?$/,""):"";
  x.fillStyle="#8fa3bd";x.font=F(600,34);x.fillText(host?t("imgPlay")+" · "+host:t("title"),W/2,H-90);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  return new File([blob],"whos-the-spy.png",{type:"image/png"});
}
async function shareImg(){
  let f=S.imgFile;
  if(!f){toast(t("wait"));try{f=await buildImage();S.imgFile=f}catch(e){toast(t("noCopy"));return}}

    h=bar()+`<h2>${spy?t("spyT"):t("peekT")}</h2><p>${spy?t("spyD"):t("peekD")}</p>
    <div class="votes">${rng(C.n).filter(i=>!S.out.includes(i)).map(i=>`<button class="btn alt" onclick="${spy?"spyPick":"peekSel"}(${i})"><span class="a">${av(i)}</span>${nm(i)}</button>`).join("")}</div>
    <div class="sticky"><button class="btn alt" onclick="go('timer')">${t("back")}</button></div>`;
  }
  else if(s==="peek"){
    h=bar()+flipStage(S.peek,cardOf(S.peek))+`<p class="hint" id="tip">${t("tip1")}</p><button class="btn" id="hp" style="visibility:hidden" onclick="peekHide()">${t("peekHide")}</button>`;
  }
  else if(s==="vote"){
    h=bar()+`<h2>${S.out.length?t("voteAgain"):t("voteT")}</h2><p>${t("voteD")}</p>
    <div class="votes">${rng(C.n).filter(i=>!S.out.includes(i)).map(i=>`<button class="btn alt" onclick="vote(${i})"><span class="a">${av(i)}</span>${nm(i)}</button>`).join("")}</div>`;
  }
  else if(s==="drum"){
    h=`<div class="drum" id="drum"><div class="bav">${av(S.accused)}</div><h2 id="dh">${t("wasSpyQ",nm(S.accused))}</h2><div id="verd" class="drumdots">🥁</div><div id="dn" style="width:100%;display:flex;flex-direction:column;gap:10px"></div></div>`;
  }
  else if(s==="twist"){
    h=`<div class="center"><div class="em">🕵️🕵️</div><h2>${t("twistT")}</h2><p>${S.under?t("twistU"):t("twistC")}</p></div><button class="btn big red" onclick="go('vote')">${t("twistB")}</button>`;
  }
  else if(s==="guess"){
    h=`<h2>${av(S.voted)} ${t("whereX",nm(S.voted))}</h2><p>${S.early?t("earlyD"):t("lastD")}</p>
    <div class="list">${sortPool().map(([p,i])=>`<button class="chip" onclick="guess(${i})"><span>${p.e}</span>${esc(pn(p))}</button>`).join("")}</div>`;
  }
  else if(s==="result"){
    const sw=S.outcome.w==="spy",line=(sw?WS:WI)[C.lang][S.outcome.line];
    h=`<div class="hero"><div class="logo">${sw?"😈":"🎉"}</div><h1 class="${sw?"bad":"good"}">${sw?t("spiesWin"):t("innWin")}</h1><p>${esc(t(...S.outcome.why))} ${line}</p></div>
    <div class="res"><div class="em">${S.place.e}</div><p>${t("placeWas")}</p><div class="big">${esc(pn(S.place))}</div>${S.under?`<p class="spyhad">${t("spyHad")}: <b>${S.spyPlace.e} ${esc(pn(S.spyPlace))}</b></p>`:""}</div>
    <div class="lbl">${t("whoWho")}</div><div class="wl">${rng(C.n).map(i=>{const c=cardOf(i);return `<div class="wr${c.spy?" spyr":""}"><span class="a">${av(i)}</span><span>${nm(i)}</span><small>${c.spy?t("lSpy"):t("lInn")}</small></div>`}).join("")}</div>
    <div class="lbl">${t("scores")}${C.target?t("firstTo",C.target):""}</div>${board(true)}
    ${!S.champ?`<button class="link" onclick="crown()">${t("endMatch")}</button>`:""}
    <div class="sticky">${S.champ?`<button class="btn big" onclick="crown()">${t("crown")}</button>`:`<button class="btn big" onclick="newRound()">${t("next")}</button>`}
    <div class="row"><button class="btn alt" onclick="share()">${t("share")}</button><button class="btn alt" onclick="go('home')">${t("menu")}</button></div></div>`;
  }
  else if(s==="champ"){
    const idx=ranking(),ord=[idx[1],idx[0],idx[2]],cls=["p2","p1","p3"],aw=awards();
    h=`<div class="hero"><div class="logo">🏆</div><h1>${t("champWins",nm(idx[0]))}</h1><p>${t("champSub")}</p></div>
    <div class="podium">${ord.map((p,k)=>`<div class="pod ${cls[k]}"><span class="a">${av(p)}</span><span class="n">${nm(p)}</span><div class="bar">${S.scores[p]}</div></div>`).join("")}</div>
    ${aw.length?`<div class="lbl">${t("awardsT")}</div><div class="wl">${aw.map((a,k)=>`<div class="aw" style="animation-delay:${.8+k*.25}s"><span class="ai">${av(a.p)}</span><div><b>${a.title}</b><small>${nm(a.p)} · ${a.desc}</small></div></div>`).join("")}</div>`:""}
    <div class="sticky"><button class="btn big" onclick="newMatch()">${t("newMatch")}</button><div class="row"><button class="btn alt" onclick="shareImg()">${t("imgBtn")}</button><button class="btn alt" onclick="share()">${t("txtBtn")}</button></div></div>`;
  }
  $("app").innerHTML=h;
  if(S.keep)S.keep=false;
  else if(same){window.scrollTo(0,keepY);const np=document.querySelector(".packs");if(np)np.scrollLeft=keepX}
  else window.scrollTo(0,0);
  S.lastScreen=s;
  const fl=$("fly");
  if(fl&&S.from){const r=fl.getBoundingClientRect(),F=S.from;S.from=null;
    fl.style.transformOrigin="0 0";fl.style.transition="none";
    fl.style.transform=`translate(${F.left-r.left}px,${F.top-r.top}px) scale(${F.width/r.width},${F.height/r.height})`;
    void fl.offsetWidth;fl.style.transition="transform .5s cubic-bezier(.2,.8,.2,1)";fl.style.transform="none";}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&["timer","peek","peekwho","spywho","places"].includes(S.screen))wake()});
applyLang();
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

</script>
</body>
</html>
